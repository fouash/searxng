# SearXNG configuration for SaudiDex company-name -> official-domain discovery.
# Keep the engine set intentionally small and focused on general web search.

use_default_settings: true

server:
  secret_key: "ultrasecretkey"
  image_proxy: false
  limiter: false
  public_instance: false
  default_http_headers:
    Access-Control-Allow-Origin: "*"
    Access-Control-Allow-Methods: "GET, OPTIONS"
    Access-Control-Allow-Headers: "Content-Type, X-Requested-With"

search:
  safe_search: 0
  formats:
    - html
    - json

outgoing:
  request_timeout: 30.0
  max_request_timeout: 60.0

ui:
  default_theme: simple

engines:
  # Primary web-search providers for SaudiDex domain discovery.
  - name: google
    disabled: false
    categories: web
    timeout: 10

  - name: bing
    disabled: false
    categories: web
    timeout: 10

  - name: brave
    disabled: false
    categories: web
    timeout: 10

  - name: mojeek
    disabled: false
    categories: web
    timeout: 10

  - name: duckduckgo
    disabled: false
    categories: web
    timeout: 10

  # Historical/archive and metadata engines are intentionally disabled.
  - name: wayback machine
    engine: wayback_machine
    shortcut: wbm
    categories: web
    disabled: true
  - name: common crawl
    engine: common_crawl
    shortcut: ccl
    categories: web
    disabled: true
  - name: memento archive
    engine: memento_archive
    shortcut: mem
    categories: web
    disabled: true
  - name: archive.today
    engine: archive_today
    shortcut: atd
    categories: web
    disabled: true
  - name: perma.cc
    engine: perma_cc
    shortcut: pcc
    categories: web
    disabled: true
  - name: arquivo.pt
    engine: arquivo_pt
    shortcut: apt
    categories: web
    disabled: true
  - name: uk web archive
    engine: uk_web_archive
    shortcut: ukw
    categories: web
    disabled: true
  - name: library of congress
    engine: loc_archives
    shortcut: loc
    categories: web
    disabled: true
  - name: crtsh
    engine: crtsh
    shortcut: crt
    categories: business
    disabled: true
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true
  - name: whois
    disabled: true
  - name: google cse
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
  - name: qwant
    disabled: true
  - name: startpage
    disabled: true
  - name: saudi companies
    engine: saudi_companies_db
    categories: business
    disabled: true
